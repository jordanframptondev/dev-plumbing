<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dev-plumbing</title>
    <script>
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem('dev-plumbing-theme');
        } catch (e) {}
        var dark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = pref === 'light' || pref === 'dark' ? pref : dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
